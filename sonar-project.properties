# SonarQube Project Configuration
sonar.projectKey=ai-pack
sonar.projectName=AI-Pack
sonar.projectVersion=1.0

# Source directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/vendor/**,**/.beads/**,**/dist/**,**/build/**,**/.scannerwork/**

# Test directories
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts

# Load suppressions from separate file
sonar.issue.ignore.multicriteria=go1
sonar.issue.ignore.multicriteria.go1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.go1.resourceKey=**/*_test.go

# Language-specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.python.version=3.9,3.10,3.11,3.12

# Analysis settings
sonar.scm.provider=git
