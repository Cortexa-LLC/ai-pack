# GraphQL schema location
schema:
  - internal/graphql/schema.graphql

# Generated code locations
exec:
  filename: internal/graphql/generated.go
  package: graphql

model:
  filename: internal/graphql/models_gen.go
  package: graphql

resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

# Autobind tells gqlgen to search for any type names in the schema in these Go packages
autobind:
  - "github.com/cortexa-llc/ai-pack/a2a-agent/internal/graphql"

# Scalar mappings
models:
  JSON:
    model: github.com/99designs/gqlgen/graphql.Map
  Metrics:
    model: github.com/cortexa-llc/ai-pack/a2a-agent/internal/graphql.Metrics
  TokenUsage:
    model: github.com/cortexa-llc/ai-pack/a2a-agent/internal/graphql.TokenUsage
  APICalls:
    model: github.com/cortexa-llc/ai-pack/a2a-agent/internal/graphql.APICalls
  Performance:
    model: github.com/cortexa-llc/ai-pack/a2a-agent/internal/graphql.Performance
