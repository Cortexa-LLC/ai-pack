name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-plugin:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/.mcp.json > /dev/null
          echo "All manifests are valid JSON"

      - name: Validate agent definitions
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          errors = []
          agents = sorted(pathlib.Path("plugin/agents").glob("*.md"))
          if not agents:
              errors.append("plugin/agents/ contains no agent definitions")
          for f in agents:
              text = f.read_text()
              m = re.match(r"\A---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{f}: missing YAML frontmatter")
                  continue
              fm = m.group(1)
              for field in ("name:", "description:"):
                  if field not in fm:
                      errors.append(f"{f}: frontmatter missing '{field.rstrip(':')}'")
              body = text[m.end():]
              if len(body.strip()) < 100:
                  errors.append(f"{f}: agent body suspiciously short")

          skills = sorted(pathlib.Path("plugin/skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("plugin/skills/ contains no skills")
          for f in skills:
              text = f.read_text()
              m = re.match(r"\A---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{f}: missing YAML frontmatter")
                  continue
              for field in ("name:", "description:"):
                  if field not in m.group(1):
                      errors.append(f"{f}: frontmatter missing '{field.rstrip(':')}'")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(agents)} agents, {len(skills)} skills")
          EOF

      - name: Check for server-era regressions
        run: |
          # The agent CLI, agent-mcp MCP tools, and server ports must not
          # reappear in the plugin layer (history notes in docs are fine).
          ! grep -rnE "mcp__agent-mcp__|localhost:808[02]|agent (create|engineer|reviewer|spelunker) " plugin/ \
            || { echo "Server-era reference found in plugin/"; exit 1; }
          echo "No server-era references in plugin/"

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version, changelog, and docs-count consistency
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys

          errors = []

          # (a) plugin.json is the single source of truth; VERSION mirrors it.
          plugin_version = json.loads(
              pathlib.Path("plugin/.claude-plugin/plugin.json").read_text()
          )["version"]
          version_file = pathlib.Path("VERSION").read_text().strip()
          if plugin_version != version_file:
              errors.append(
                  f"Version mismatch: plugin/.claude-plugin/plugin.json says "
                  f"'{plugin_version}' but VERSION says '{version_file}'. "
                  "plugin.json is the source of truth — update VERSION to match."
              )

          # (b) CHANGELOG.md must have a heading for the current version.
          changelog = pathlib.Path("CHANGELOG.md")
          if not changelog.exists():
              errors.append("CHANGELOG.md is missing — every release needs an entry.")
          elif not re.search(
              rf"^##\s+\[?{re.escape(plugin_version)}\]?\b",
              changelog.read_text(),
              re.MULTILINE,
          ):
              errors.append(
                  f"CHANGELOG.md has no '## [{plugin_version}]' heading — add an "
                  "entry for the version in plugin/.claude-plugin/plugin.json."
              )

          # (c) Docs must state the actual agent/skill counts (spelled out).
          WORDS = {1: "one", 2: "two", 3: "three", 4: "four", 5: "five",
                   6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten",
                   11: "eleven", 12: "twelve"}
          # Each entry: label -> (count, noun regex). The count word must sit
          # within two words of the noun ("seven subagents", "four workflow
          # skills") so an unrelated "seven"/"four" elsewhere cannot false-pass.
          counts = {
              "subagents (plugin/agents/*.md)": (
                  len(list(pathlib.Path("plugin/agents").glob("*.md"))),
                  r"(?:sub)?agents?\b",
              ),
              "skills (plugin/skills/*/SKILL.md)": (
                  len(list(pathlib.Path("plugin/skills").glob("*/SKILL.md"))),
                  r"skills?\b",
              ),
          }
          docs = ["docs/content/intro.md", "README.md"]
          for label, (count, noun) in counts.items():
              word = WORDS.get(count)
              if word is None:
                  errors.append(
                      f"{count} {label} exceeds the number-word map in "
                      "release-consistency — extend WORDS in .github/workflows/ci.yml."
                  )
                  continue
              pattern = rf"\b{word}\b(?:\s+\w+){{0,2}}\s+{noun}"
              for doc in docs:
                  text = pathlib.Path(doc).read_text().lower()
                  if not re.search(pattern, text):
                      errors.append(
                          f"{doc}: expected '{word}' next to the {label.split(' ')[0]} "
                          f"wording — the tree has {count} {label}; update the doc's counts."
                      )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Release consistency OK: version {plugin_version}, "
                f"changelog entry present, docs counts match ({counts})")
          EOF

  docs-build:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Docusaurus site
        working-directory: docs/website
        # package-lock.json is gitignored (docs/website/.gitignore), so npm
        # install rather than npm ci — same approach as deploy-docs.yml.
        run: |
          npm install
          npm run build
