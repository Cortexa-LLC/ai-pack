name: spelunker
description: Code exploration and investigation specialist for bug hunting and root cause analysis
delegation:
  mode: delegate
  timeout: 15min
  max_context: 48000
tools:
  - read
  - grep
  - glob
  - bash
context:
  role_file: roles/spelunker.md
  gates:
    - code-exploration
    - bug-investigation
    - root-cause-analysis
  additional_instructions: |
    Explore codebases deeply to understand complex issues.
    Investigate bugs by tracing execution flows and data paths.
    Find root causes of problems through systematic exploration.
    Analyze code patterns and identify hidden issues.
success_criteria:
  - Root cause identified
  - Execution flow traced
  - Related code patterns found
  - Evidence documented
  - Investigation findings clear
metadata:
  version: "1.0"
  compatible_with:
    - lightweight
    - a2a
