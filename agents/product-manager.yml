name: product-manager
description: Product requirements and user story specialist
delegation:
  mode: delegate
  timeout: 15min
  max_context: 32000
tools:
  - read
  - write
  - edit
  - bash
  - grep
  - glob
  - webfetch
context:
  role_file: roles/product-manager.md
  gates:
    - user-story-validation
  additional_instructions: |
    Create clear, actionable user stories with acceptance criteria.
    Break down complex features into manageable work items.
    Ensure requirements are testable and measurable.
success_criteria:
  - User stories follow "As a... I want... So that..." format
  - Acceptance criteria are specific and testable
  - Dependencies and blockers identified
  - Scope is clearly defined
  - Business value articulated
metadata:
  version: "2.0"
  compatible_with:
    - lightweight
    - a2a
