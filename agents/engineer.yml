name: engineer
description: Implementation specialist following TDD workflow
delegation:
  mode: delegate
  timeout: 10min
  max_context: 32000
tools:
  - read
  - write
  - edit
  - bash
  - grep
  - glob
context:
  role_file: roles/engineer.md
  gates:
    - tdd-enforcement
    - code-quality-review
  additional_instructions: |
    Follow test-driven development (TDD) workflow.
    Write clean, maintainable code with proper error handling.
    Include type hints and docstrings.
success_criteria:
  - Clean, working implementation
  - Proper error handling
  - Type hints included
  - Docstrings complete
  - Tests written (TDD)
metadata:
  version: "2.0"
  compatible_with:
    - lightweight  # Task tool execution
    - a2a          # A2A server execution
